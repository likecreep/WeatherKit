name: Auto Sync Fork

on:
  schedule:
    # 每天 UTC 时间 00:00 自动执行（北京时间早上 8:00）
    - cron: '0 0 * * *'
  # 允许在 Actions 面板手动点击执行
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予更新分支的写入权限
    steps:
      - name: Sync fork with upstream
        # gh repo sync 默认同步主分支，如果你的主分支是 master，无需修改。
        run: gh repo sync ${{ github.repository }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
